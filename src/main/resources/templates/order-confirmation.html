<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation</title>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 40px;
            width: 420px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        h2 {
            color: #4CAF50;
            margin-bottom: 10px;
            font-size: 26px;
        }

        .product-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .price {
            font-size: 18px;
            color: #4a90e2;
            margin-bottom: 20px;
        }

        .order-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #4a90e2;
            text-decoration: none;
            font-size: 16px;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Order Confirmed!</h2>

    <img th:src="${product.image}" alt="Product image">

    <div class="product-title" th:text="${product.title}"></div>

    <div class="price" th:text="${product.price + ' $'}"></div>

    <div class="order-info">
        <p>Order Number: <strong th:text="${#numbers.formatInteger(#dates.createNow().time, 0)}"></strong></p>
        <p>Date: <strong th:text="${#dates.format(#dates.createNow(), 'yyyy-MM-dd HH:mm')}"></strong></p>
    </div>

    <a th:href="@{/products}">Back to products</a>
</div>

</body>
</html>
