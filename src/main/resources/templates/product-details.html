<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Details</title>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 30px;
            width: 700px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        img {
            width: 100%;
            height: 350px;
            object-fit: contain;
            border-radius: 12px;
        }

        h2 {
            margin-top: 20px;
            font-size: 28px;
        }

        .price {
            font-size: 24px;
            color: #4a90e2;
            margin-top: 10px;
        }

        .desc {
            margin-top: 20px;
            line-height: 1.6;
            color: #444;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #3e8e41;
        }
    </style>
</head>

<body>

<div class="container">

    <img th:src="${product.image}" alt="Product image">

    <h2 th:text="${product.title}"></h2>

    <div class="price" th:text="${product.price + ' $'}"></div>

    <p class="desc" th:text="${product.description}"></p>

    <form th:action="@{'/order/' + ${product.id}}" method="post">
        <button type="submit">Order Now</button>
    </form>

</div>

</body>
</html>
