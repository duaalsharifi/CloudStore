version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "Using Java 17"

  pre_build:
    commands:
      - echo "Entered prebuild phase"

  build:
    commands:
      - echo "Building CloudStore..."
      - mvn clean package -DskipTests
      - ls -la target

  post_build:
    commands:
      - echo "Build completed"

artifacts:
  files:
    - target/CloudStore-0.0.1-SNAPSHOT.jar
  discard-paths: yes
